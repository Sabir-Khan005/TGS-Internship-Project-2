<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Dashboard</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">

            <div class="logo">
                <h2>E-Commerce</h2>
            </div>

            <ul>

                <li><a href="#"><i class="fa-solid fa-user-shield"></i> Admin</a></li>

                <li><a href="#"><i class="fa-solid fa-users"></i> Customer</a></li>

                <li><a href="#"><i class="fa-solid fa-list"></i> Category</a></li>

                <li><a href="#"><i class="fa-solid fa-box"></i> Product</a></li>

                <li><a href="#"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>

                <li><a href="#"><i class="fa-solid fa-bag-shopping"></i> Order</a></li>

                <li><a href="#"><i class="fa-solid fa-star"></i> Feedback</a></li>

                <li><a href="#"><i class="fa-solid fa-circle-question"></i> FAQs</a></li>

            </ul>

        </div>

        <!-- Main Area -->
        <div class="main">

            <div class="header">
                <h1>Dashboard</h1>

                <div class="profile">
                    <i class="fa-solid fa-user-circle"></i> Admin
                </div>
            </div>

            <div class="content">

                <h2>Welcome Admin</h2>

                <p>
                    Your dashboard content will appear here.
                </p>

            </div>

        </div>

    </div>

</body>

</html>
